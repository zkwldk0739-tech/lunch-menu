<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 점심 메뉴</title>

  <!-- 🎉 폭죽 효과 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
    .container { width: 100%; max-width: 480px; background: white; border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
    
    h1 { font-size: 1.6rem; color: #111827; margin-bottom: 4px; text-align: center; font-weight: 800; }
    .sub-title { font-size: 0.85rem; color: #6b7280; text-align: center; font-weight: 600; margin-bottom: 8px; }
    
    .timer-box { background: #fef2f2; border: 1px solid #fca5a5; border-radius: 12px; padding: 10px; text-align: center; font-weight: 800; color: #dc2626; font-size: 0.95rem; margin-bottom: 20px; }
    .timer-box.active { background: #fee2e2; border-color: #ef4444; animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .card { background: #ffffff; border: 1px solid #f3f4f6; border-radius: 16px; padding: 18px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .card-title { font-size: 0.95rem; color: #4b5563; margin-bottom: 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }

    /* 👤 이름 선택 버튼 */
    .name-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .name-btn { flex: 1; min-width: 90px; background: #f9fafb; border: 1.5px solid #e5e7eb; color: #374151; padding: 10px; border-radius: 20px; font-size: 0.95rem; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.2s; }
    .name-btn.active { background: #6366f1; border-color: #6366f1; color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

    .admin-btn { font-size: 0.75rem; color: #4f46e5; background: #eeefff; border: none; padding: 4px 8px; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .logout-btn { font-size: 0.75rem; color: #ef4444; background: #fef2f2; border: 1px solid #fca5a5; padding: 4px 8px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-bottom: 12px; display: none; }

    /* 🏪 식당 그리드 */
    .restaurant-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .rest-select-btn { background: #ffffff; border: 1px solid #e5e7eb; color: #4b5563; padding: 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.15s; }
    .rest-select-btn.active { background: #4f46e5; border-color: #4f46e5; color: #ffffff; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); }
    
    .rest-select-btn.highlight {
      background: #ff9f43 !important;
      color: #ffffff !important;
      border-color: #ff9f43 !important;
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(255, 159, 67, 0.4);
    }

    .rest-select-btn.no-lunch { background: #fef2f2; border-color: #fca5a5; color: #dc2626; font-weight: 800; }
    .rest-select-btn.no-lunch.active { background: #ef4444; border-color: #ef4444; color: #ffffff; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35); }

    .menu-section { display: none; background: #f5f3ff; border-radius: 12px; padding: 14px; margin-bottom: 16px; border: 1px solid #ede9fe; }
    .menu-list-view { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; max-height: 220px; overflow-y: auto; }
    .menu-tag-btn { background: #ffffff; border: 1.5px solid #ddd6fe; color: #6d28d9; padding: 8px 12px; border-radius: 16px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .menu-tag-btn.active { background: #7c3aed; color: #ffffff; border-color: #7c3aed; box-shadow: 0 2px 8px rgba(124, 58, 237, 0.3); }

    button.primary-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35); margin-top: 8px; }

    /* 🎲 식당 랜덤 뽑기 박스 */
    .random-box { text-align: center; padding: 12px 0 0 0; margin-top: 8px; }
    .spin-btn { background: linear-gradient(135deg, #ff9f43, #ff5252); color: white; border: none; padding: 12px 28px; font-size: 1rem; font-weight: 800; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 14px rgba(255, 82, 82, 0.35); transition: transform 0.1s; width: 100%; }
    .spin-btn:active { transform: scale(0.97); }

    .clear-all-btn { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; padding: 4px 8px; font-size: 0.75rem; font-weight: 700; border-radius: 6px; cursor: pointer; }

    .status-list { list-style: none; }
    .status-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; border-bottom: 1px solid #f3f4f6; border-radius: 10px; margin-bottom: 4px; background: #fafafa; }
    .status-item:last-child { border-bottom: none; }
    .status-item.skip-lunch { background-color: #fef2f2; border-left: 4px solid #ef4444; opacity: 0.85; }
    .status-item.skip-lunch .restaurant-name { color: #dc2626; font-weight: bold; }

    .user-name-box { display: flex; align-items: center; gap: 6px; }
    .user-name { font-weight: bold; font-size: 1rem; color: #1f2937; }
    .delete-btn { background: #ef4444; color: white; border: none; padding: 3px 7px; font-size: 0.7rem; border-radius: 6px; cursor: pointer; }
    .restaurant-name { color: #4f46e5; font-weight: 700; font-size: 1.05rem; margin-top: 2px; }
    .selected-menu-text { font-size: 0.85rem; color: #6b7280; font-weight: 600; margin-top: 2px; }
    .map-btn { display: inline-block; margin-top: 6px; font-size: 0.8rem; color: #4f46e5; background: #eeefff; padding: 6px 10px; border-radius: 6px; font-weight: 600; text-decoration: none; }
    .time-stamp { font-size: 0.8rem; color: #9ca3af; text-align: right; }
    .empty-msg { text-align: center; color: #9ca3af; padding: 20px 0; font-size: 0.95rem; }

    /* 📋 식당 현장 주문용 요약 스타일 */
    .summary-card { background: #f0fdf4; border: 1.5px solid #bbf7d0; border-radius: 16px; padding: 18px; margin-bottom: 20px; }
    .summary-title { font-size: 0.95rem; color: #166534; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .summary-rest-block { background: #ffffff; border: 1px solid #dcfce7; border-radius: 10px; padding: 12px; margin-bottom: 8px; }
    .summary-rest-name { font-weight: 800; color: #15803d; font-size: 0.95rem; margin-bottom: 6px; }
    .summary-menu-item { font-size: 0.85rem; color: #374151; font-weight: 600; margin-bottom: 4px; padding-left: 4px; }
    .summary-count { color: #16a34a; font-weight: 800; }
    .summary-users { font-size: 0.8rem; color: #6b7280; font-weight: 500; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
  <h1>🍱 오늘의 점심 메뉴</h1>
  <div class="sub-title">5분 내 메뉴 미선택 시 랜덤 주문</div>
  
  <div class="timer-box" id="timerDisplay">⏱️ 타이머 로딩 중...</div>

  <div class="card">
    <div class="card-title">
      👤 내 이름 선택
      <button class="admin-btn" onclick="manageNames()">⚙️ 이름 관리</button>
    </div>
    <div class="name-grid" id="nameGrid"></div>
    <button class="logout-btn" id="logoutBtn" onclick="logoutUser()">🔓 로그인 해제</button>
    <input type="hidden" id="userName">

    <div class="card-title">📍 식당 선택</div>
    <div class="restaurant-grid" id="restGrid">
      <button class="rest-select-btn" onclick="selectRest('제주국수', 'https://map.naver.com/p/entry/place/17924427', menusJeju, this)">🍜 제주국수</button>
      <button class="rest-select-btn" onclick="selectRest('보끔당', 'https://map.naver.com/p/entry/place/1445717867', menusBokkeum, this)">🍗 보끔당</button>
      <button class="rest-select-btn" onclick="selectRest('맛보래', 'https://map.naver.com/p/entry/place/33021725', menusMatborae, this)">🍲 맛보래</button>
      <button class="rest-select-btn" onclick="selectRest('진대광부대찌개', 'https://map.naver.com/p/entry/place/2082064418', menusJin, this)">🥘 진대광부대찌개</button>
      <button class="rest-select-btn" onclick="selectRest('위풍당', 'https://map.naver.com/p/entry/place/36999376', menusWipung, this)">🍖 위풍당</button>
      <button class="rest-select-btn" onclick="selectRest('풍조미역', 'https://map.naver.com/p/entry/place/1907146760', menusMiyeok, this)">🥣 풍조미역</button>
      <button class="rest-select-btn" onclick="selectRest('바오젠', 'https://map.naver.com/p/entry/place/1610620090', menusBao, this)">🥟 바오젠</button>
      <button class="rest-select-btn" onclick="selectRest('이층집', 'https://map.naver.com/p/entry/place/1045831832', menusEcheong, this)">🥩 이층집</button>
      <button class="rest-select-btn" onclick="selectRest('담미온', 'https://map.naver.com/p/entry/place/37997607', menusDammion, this)">🥣 담미온</button>
      <button class="rest-select-btn no-lunch" onclick="selectRest('🙅‍♂️ 점심 패스', '', [], this)">🙅‍♂️ 점심 패스</button>
    </div>

    <div class="menu-section" id="menuSection">
      <div class="card-title" style="margin-bottom:4px; color:#5b21b6;">🍽️ 메뉴 선택 (클릭)</div>
      <div class="menu-list-view" id="menuGrid"></div>
    </div>

    <button class="primary-btn" onclick="addStatus()">출발 알리기 🚀</button>

    <div class="random-box">
      <button class="spin-btn" id="spinBtn" onclick="spinRandomRest()">🎲 식당 랜덤 뽑기!</button>
    </div>
  </div>

  <!-- 📋 현장 주문용 자동 합산 요약 카드 -->
  <div class="summary-card" id="summaryCard" style="display: none;">
    <div class="summary-title">📋 식당 주문용 요약 합산</div>
    <div id="summaryContent"></div>
  </div>

  <div class="card">
    <div class="card-title">
      👀 팀원 실시간 현황
      <button class="clear-all-btn" onclick="clearAllStatus()">🗑️ 전체 삭제</button>
    </div>
    <ul class="status-list" id="statusList">
      <li class="empty-msg">불러오는 중...</li>
    </ul>
  </div>

</div>

<script>
  const defaultPins = {
    '김현수': '0410',
    '김진석': '8291',
    '서인태': '4703'
  };

  let teamMembers = JSON.parse(localStorage.getItem("lunchTeamMembers")) || Object.keys(defaultPins);

  const restaurants = [
    { name: '제주국수', url: 'https://map.naver.com/p/entry/place/17924427', menus: ['멸치 고기국수', '닭곰탕', '순두부', '고기국수', '고기국수 (양 많이)'] },
    { name: '보끔당', url: 'https://map.naver.com/p/entry/place/1445717867', menus: ['1인 뚝배기 닭볶음탕', '1인 묵은지 뚝배기 닭볶음탕'] },
    { name: '맛보래', url: 'https://map.naver.com/p/entry/place/33021725', menus: ['김치 두루치기', '참치 김치찌개', '고기 김치찌개', '오징어 볶음', '고추장 불고기'] },
    { name: '진대광부대찌개', url: 'https://map.naver.com/p/entry/place/2082064418', menus: ['부대찌개 2인', '부대찌개 3인', '부대찌개 4인'] },
    { name: '위풍당', url: 'https://map.naver.com/p/entry/place/36999376', menus: ['돼지 불족발', '차슈 덮밥', '불맛 차슈 덮밥', '직화 불고기 덮밥', '데리야끼 치킨 덮밥', '불맛 데리야끼 치킨 덮밥'] },
    { name: '풍조미역', url: 'https://map.naver.com/p/entry/place/1907146760', menus: ['굴 미역국', '조개 미역국', '소고기 미역국', '전복 미역국', '고등어구이'] },
    { name: '바오젠', url: 'https://map.naver.com/p/entry/place/1610620090', menus: ['완탕면', '매운 완탕면', '게살 챠오판', '마늘 버터 챠오판', '세트 A (완탕면 + 멘보샤)', '세트 B (매운 완탕면 + 멘보샤)', '세트 C (완탕면 + 딤섬 2pcs)', '세트 D (매운 완탕면 + 딤섬 2pcs)', '세트 E (게살 챠오판 + 미니 완탕)'] },
    { name: '이층집', url: 'https://map.naver.com/p/entry/place/1045831832', menus: ['시골 된장', '우렁 된장', '소고기 국밥', '물냉면', '비빔냉면'] },
    { name: '담미온', url: 'https://map.naver.com/p/entry/place/37997607', menus: ['순두부', '순대국밥', '부대 특', '얼큰 순대만', '뼈해장국', '보쌈정식'] }
  ];

  const menusJeju = restaurants[0].menus;
  const menusBokkeum = restaurants[1].menus;
  const menusMatborae = restaurants[2].menus;
  const menusJin = restaurants[3].menus;
  const menusWipung = restaurants[4].menus;
  const menusMiyeok = restaurants[5].menus;
  const menusBao = restaurants[6].menus;
  const menusEcheong = restaurants[7].menus;
  const menusDammion = restaurants[8].menus;

  const firebaseConfig = {
    apiKey: "AIzaSyCoErZyqOAfFFWFb9s3bBNEqF7N85HT-Oo",
    authDomain: "parkingcim.firebaseapp.com",
    projectId: "parkingcim",
    storageBucket: "parkingcim.firebasestorage.app",
    messagingSenderId: "969011689771",
    appId: "1:969011689771:web:8d5cde4c6f81185944ad6e",
    measurementId: "G-ZSZD9LLL9P"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  function initDefaultUserPins() {
    Object.keys(defaultPins).forEach(name => {
      const userRef = db.collection("users").doc(name);
      userRef.get().then(doc => {
        if (!doc.exists) {
          userRef.set({ pin: defaultPins[name] });
        }
      });
    });
  }

  function updateTimer() {
    const now = new Date();
    const timerBox = document.getElementById("timerDisplay");

    const start = new Date(now);
    start.setHours(12, 0, 0, 0);

    const end = new Date(now);
    end.setHours(12, 5, 0, 0);

    if (now < start) {
      timerBox.className = "timer-box";
      timerBox.innerHTML = `⌛ 12:00부터 5분 타이머가 시작됩니다`;
    } else if (now >= start && now <= end) {
      const diffSec = Math.floor((end - now) / 1000);
      const m = Math.floor(diffSec / 60);
      const s = diffSec % 60;
      timerBox.className = "timer-box active";
      timerBox.innerHTML = `🚨 랜덤 주문 마감까지: 0${m}:${s < 10 ? '0' : ''}${s} 🚨`;
    } else {
      timerBox.className = "timer-box";
      timerBox.innerHTML = `⚠️ 12:05 마감 완료 (미선택 시 자동 랜덤 주문)`;
    }
  }

  function renderNameGrid() {
    const nameGrid = document.getElementById("nameGrid");
    const nameInput = document.getElementById("userName");
    const logoutBtn = document.getElementById("logoutBtn");

    const savedUser = localStorage.getItem("lunchLoggedInUser");
    if (savedUser) {
      nameInput.value = savedUser;
      logoutBtn.style.display = "inline-block";
    } else {
      logoutBtn.style.display = "none";
    }

    nameGrid.innerHTML = "";

    teamMembers.forEach(member => {
      const btn = document.createElement("button");
      btn.className = "name-btn";
      btn.innerText = member;

      if (nameInput.value === member) {
        btn.classList.add("active");
      }

      btn.onclick = function() {
        if (localStorage.getItem("lunchLoggedInUser") === member) {
          return;
        }

        db.collection("users").doc(member).get().then((doc) => {
          let targetPin = defaultPins[member] || "0000";
          if (doc.exists && doc.data().pin) {
            targetPin = doc.data().pin;
          }

          const inputPin = prompt(`'${member}'님의 비밀번호 4자리를 입력해주세요:`);
          if (!inputPin || inputPin.trim() === "") return;

          if (inputPin === targetPin) {
            localStorage.setItem("lunchLoggedInUser", member);
            setActiveName(member);
          } else {
            alert("❌ 비밀번호가 일치하지 않습니다!");
          }
        });
      };

      nameGrid.appendChild(btn);
    });
  }

  function setActiveName(name) {
    document.getElementById("userName").value = name;
    renderNameGrid();
  }

  function logoutUser() {
    if (confirm("로그인을 해제하시겠습니까?")) {
      localStorage.removeItem("lunchLoggedInUser");
      document.getElementById("userName").value = "";
      renderNameGrid();
    }
  }

  function manageNames() {
    const adminPwd = prompt("팀원 관리 권한을 위한 관리자 비밀번호를 입력하세요:");
    if (adminPwd === "0410") {
      const action = prompt("1: 팀원 추가\n2: 팀원 삭제\n3: 비밀번호 초기화\n(원하는 작업의 번호를 입력하세요)");
      
      if (action === "1") {
        const newMember = prompt("추가할 팀원 이름을 입력하세요:");
        if (newMember && !teamMembers.includes(newMember)) {
          const newPin = prompt(`${newMember}님에게 부여할 비밀번호 4자리를 입력하세요:`);
          if (newPin && newPin.length >= 4) {
            teamMembers.push(newMember);
            localStorage.setItem("lunchTeamMembers", JSON.stringify(teamMembers));
            db.collection("users").doc(newMember).set({ pin: newPin });
            renderNameGrid();
            alert(`${newMember}님이 추가되었습니다.`);
          } else {
            alert("비밀번호 4자리 이상을 설정해야 추가됩니다.");
          }
        }
      } else if (action === "2") {
        let menuList = "삭제할 팀원의 번호를 선택하세요:\n";
        teamMembers.forEach((m, idx) => {
          menuList += `${idx + 1}: ${m}\n`;
        });
        const selectedIdx = prompt(menuList);
        if (selectedIdx) {
          const num = parseInt(selectedIdx) - 1;
          if (num >= 0 && num < teamMembers.length) {
            const delMember = teamMembers[num];
            teamMembers.splice(num, 1);
            localStorage.setItem("lunchTeamMembers", JSON.stringify(teamMembers));
            db.collection("users").doc(delMember).delete();
            if (localStorage.getItem("lunchLoggedInUser") === delMember) {
              localStorage.removeItem("lunchLoggedInUser");
              document.getElementById("userName").value = "";
            }
            renderNameGrid();
            alert(`${delMember}님이 목록에서 삭제되었습니다.`);
          } else {
            alert("❌ 올바른 번호를 입력해주세요.");
          }
        }
      } else if (action === "3") {
        let menuList = "비밀번호를 초기화할 팀원의 번호를 선택하세요:\n";
        teamMembers.forEach((m, idx) => {
          menuList += `${idx + 1}: ${m}\n`;
        });
        
        const selectedIdx = prompt(menuList);
        if (selectedIdx) {
          const num = parseInt(selectedIdx) - 1;
          if (num >= 0 && num < teamMembers.length) {
            const targetMember = teamMembers[num];
            const newPin = prompt(`'${targetMember}'님의 새 비밀번호 4자리를 입력하세요:`);
            if (newPin && newPin.length >= 4) {
              db.collection("users").doc(targetMember).set({ pin: newPin }).then(() => {
                alert(`'${targetMember}'님의 비밀번호가 변경되었습니다.`);
              });
            } else {
              alert("비밀번호는 4자리 이상이어야 합니다.");
            }
          } else {
            alert("❌ 올바른 번호를 입력해주세요.");
          }
        }
      }
    } else if (adminPwd !== null) {
      alert("❌ 관리자 비밀번호가 일치하지 않습니다!");
    }
  }

  window.onload = function() {
    initDefaultUserPins();
    renderNameGrid();
    updateTimer();
    setInterval(updateTimer, 1000);
  };

  function spinRandomRest() {
    const spinBtn = document.getElementById('spinBtn');
    const buttons = Array.from(document.querySelectorAll('.rest-select-btn')).filter(b => !b.classList.contains('no-lunch'));
    
    if (buttons.length === 0) return;

    spinBtn.disabled = true;
    let count = 0;
    const maxCount = 16;
    let speed = 60;

    function highlightNext() {
      buttons.forEach(b => b.classList.remove('highlight'));
      const randomIndex = Math.floor(Math.random() * buttons.length);
      buttons[randomIndex].classList.add('highlight');

      count++;
      if (count < maxCount) {
        speed += 14;
        setTimeout(highlightNext, speed);
      } else {
        setTimeout(() => {
          buttons[randomIndex].classList.remove('highlight');
          buttons[randomIndex].click();
          confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
          spinBtn.disabled = false;
        }, 200);
      }
    }

    highlightNext();
  }

  let selectedRestName = "";
  let selectedRestUrl = "";
  let selectedMenuName = "";

  function selectRest(name, url, menus, btnElement) {
    document.querySelectorAll('.rest-select-btn').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');

    selectedRestName = name;
    selectedRestUrl = url;
    selectedMenuName = "";

    const menuSection = document.getElementById('menuSection');
    const menuGrid = document.getElementById('menuGrid');

    if (name.includes('점심 패스')) {
      menuSection.style.display = 'none';
      return;
    }

    if (menus.length > 0) {
      menuSection.style.display = 'block';
      menuGrid.innerHTML = '';

      menus.forEach(menu => {
        const btn = document.createElement('button');
        btn.className = 'menu-tag-btn';
        btn.innerText = menu;
        
        btn.onclick = function() {
          document.querySelectorAll('.menu-tag-btn').forEach(mb => mb.classList.remove('active'));
          btn.classList.add('active');
          selectedMenuName = menu;
        };

        menuGrid.appendChild(btn);
      });
    } else {
      menuSection.style.display = 'none';
    }
  }

  const getToday = () => new Date().toISOString().slice(0, 10);

  function addStatus() {
    const name = document.getElementById("userName").value;
    let restName = selectedRestName;
    let restUrl = selectedRestUrl;
    let menuName = selectedMenuName;

    if (!name) { alert("먼저 내 이름을 선택하고 비밀번호를 입력해주세요!"); return; }
    if (!restName) { alert("식당 또는 '점심 패스'를 선택해주세요!"); return; }

    if (!restName.includes('점심 패스') && !menuName) {
      menuName = "🎲 랜덤주문";
    }

    const now = new Date();
    const timeString = now.getHours().toString().padStart(2, '0') + ":" + 
                       now.getMinutes().toString().padStart(2, '0');

    db.collection("lunch").doc(name).set({
      name: name,
      rest: restName,
      menu: menuName || "",
      url: restUrl,
      time: timeString,
      date: getToday(),
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      confetti({ particleCount: 110, spread: 80, origin: { y: 0.6 } });

      document.getElementById('menuSection').style.display = 'none';
      document.querySelectorAll('.rest-select-btn').forEach(b => b.classList.remove('active'));
      selectedRestName = "";
      selectedMenuName = "";
    });
  }

  function deleteStatus(docId) {
    if (confirm(`${docId}님의 등록을 취소하시겠습니까?`)) {
      db.collection("lunch").doc(docId).delete().then(() => {
        alert("취소되었습니다.");
      });
    }
  }

  function clearAllStatus() {
    const adminPwd = prompt("전체 삭제를 위한 관리자 비밀번호를 입력해주세요:");
    if (adminPwd === "0410") {
      if (confirm("오늘 등록된 모든 출발 알림 내역을 정말 삭제하시겠습니까?")) {
        db.collection("lunch").where("date", "==", getToday()).get().then((snapshot) => {
          const batch = db.batch();
          snapshot.forEach((doc) => {
            batch.delete(doc.ref);
          });
          return batch.commit();
        }).then(() => {
          alert("오늘의 모든 제출 현황이 삭제되었습니다.");
        });
      }
    } else if (adminPwd !== null) {
      alert("❌ 관리자 비밀번호가 일치하지 않습니다!");
    }
  }

  // 실시간 현황 및 식당별 요약 집계 함수
  db.collection("lunch")
    .where("date", "==", getToday())
    .onSnapshot((snapshot) => {
      const listEl = document.getElementById("statusList");
      const summaryCard = document.getElementById("summaryCard");
      const summaryContent = document.getElementById("summaryContent");
      
      if (snapshot.empty) {
        listEl.innerHTML = `<li class="empty-msg">아직 출발한 사람이 없습니다.</li>`;
        summaryCard.style.display = "none";
        return;
      }

      let html = "";
      const summaryData = {}; // 식당별/메뉴별 수량 집계용 객체

      snapshot.forEach((doc) => {
        const item = doc.data();
        const isSkip = item.rest.includes('점심 패스');
        const myName = document.getElementById("userName").value;
        const isMine = item.name === myName;
        
        // 1. 실시간 목록 생성
        html += `
          <li class="status-item ${isSkip ? 'skip-lunch' : ''}">
            <div>
              <div class="user-name-box">
                <span class="user-name">${item.name}</span>
                ${isMine ? `<button class="delete-btn" onclick="deleteStatus('${item.name}')">❌ 취소</button>` : ''}
              </div>
              <div class="restaurant-name">${isSkip ? '🙅‍♂️ 점심 패스' : '📍 ' + item.rest}</div>
              ${!isSkip && item.menu ? `<div class="selected-menu-text">🍱 선택 메뉴: ${item.menu}</div>` : ''}
              ${item.url ? `<a href="${item.url}" target="_blank" rel="noopener noreferrer" class="map-btn">🗺️ 지도에서 위치 보기</a>` : ''}
            </div>
            <div class="time-stamp">${item.time} ${isSkip ? '확인' : '출발'}</div>
          </li>
        `;

        // 2. 주문 요약 데이터 집계 (점심 패스 제외)
        if (!isSkip) {
          const rest = item.rest;
          const menu = item.menu || "메뉴 미선택";

          if (!summaryData[rest]) summaryData[rest] = {};
          if (!summaryData[rest][menu]) summaryData[rest][menu] = [];
          
          summaryData[rest][menu].push(item.name);
        }
      });

      listEl.innerHTML = html;

      // 3. 요약 카드 렌더링
      let summaryHtml = "";
      const rests = Object.keys(summaryData);

      if (rests.length > 0) {
        rests.forEach(rest => {
          summaryHtml += `<div class="summary-rest-block"><div class="summary-rest-name">📍 ${rest}</div>`;
          Object.keys(summaryData[rest]).forEach(menu => {
            const users = summaryData[rest][menu];
            summaryHtml += `
              <div class="summary-menu-item">
                • ${menu} <span class="summary-count">(${users.length}개)</span> 
                <span class="summary-users">: ${users.join(', ')}</span>
              </div>
            `;
          });
          summaryHtml += `</div>`;
        });
        summaryContent.innerHTML = summaryHtml;
        summaryCard.style.display = "block";
      } else {
        summaryCard.style.display = "none";
      }
    });
</script>

</body>
</html>
